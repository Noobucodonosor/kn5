name: CI — Backend Unit Tests & Repo Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests & Repo Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify export-demo command
        run: |
          python3 main.py export-demo --out /tmp/samples.json
          test -s /tmp/samples.json

      - name: Run repository boundary & secret check
        run: python3 scripts/repo_check.py
